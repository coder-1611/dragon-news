THESIS: A 1913 broadsheet printed by a 2026 machine. Refuses the card-grid news homepage and the photo-with-scrim hero.
OWN-WORLD: newsprint ground; press-black and Dragon-maroon fields; registration-cyan hairlines. Blackletter nameplate, Didone headlines, serif body, a mono wire layer. Double rules, column rules, drop caps, halftone dots.
STORY: a Dragon lands, knows in one glance this is the school paper, reads the lead, taps one story, comes back tomorrow. A writer finds the newsroom door.
FIRST VIEWPORT: wire strip, blackletter nameplate, black rail, crawl; then a press-black hero: live maroon halftone of the lead cover right, "Dragon Nation gets its news here." left at 7rem, two actions, lead-story slip bottom right, cyan crop marks in the corners.
FORM: composing room / wire, candidate 1 of 7 (brief-pinned over assigned 5), seed 53f0cef5.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
